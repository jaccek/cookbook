<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Szczegóły przepisu</title>
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body data-page="recipe">
    <header class="topbar">
      <div class="container">
        <p class="eyebrow">Szczegóły przepisu</p>
        <h1>Książka kucharska</h1>
      </div>
    </header>

    <main class="container">
      <a class="back-link" href="index.html">← Powrót do wszystkich przepisów</a>

      <article id="recipeDetail" class="recipe-detail" aria-live="polite">
        <div class="recipe-card__header">
          <h1 id="recipeTitle">Ładowanie...</h1>
          <span id="recipeMeta" class="recipe-card__meta">Szybki posiłek</span>
        </div>

        <div id="recipeGallery" class="recipe-detail__gallery"></div>

        <p id="recipeDescription" class="recipe-detail__description"></p>

        <div class="recipe-detail__source">
          <a
            id="recipeSource"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            style="display:inline-flex; align-items:center; gap:0.4rem; background:#f4efe8; color:#2d4f28; text-decoration:none; border:1px solid #e2d9ca; border-radius:999px; padding:0.55rem 0.9rem; font-weight:700; transition:background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;"
          >
            Oryginał przepisu
          </a>
        </div>

        <div id="recipeTags" class="recipe-card__tags"></div>

        <div class="recipe-detail__section">
          <h2>Składniki</h2>
          <ul id="recipeIngredients"></ul>
        </div>

        <div class="recipe-detail__section">
          <h2>Przygotowanie</h2>
          <ol id="recipeSteps"></ol>
        </div>
      </article>
    </main>

    <script src="app.js"></script>
  </body>
</html>
